<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TOEIC Listening Trainer</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f5;color:#183534;font:16px system-ui,sans-serif}main{max-width:650px;margin:auto;padding:20px}h1{font-size:26px;margin:0 0 5px}h2{font-size:20px}small,.muted{color:#536764}section{background:white;border:1px solid #d5e1df;border-radius:16px;padding:20px;margin:16px 0}button,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #a9c5bf;border-radius:10px;padding:12px;background:white;color:#183534}button.primary{background:#176b60;color:white;border-color:#176b60}button:disabled{opacity:.45;cursor:default}button.chosen{background:#d6ede7;border:2px solid #176b60}button.good{background:#d6efdf}button.bad{background:#f9dddd} .flex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.flex button{flex:1}select{padding:8px;max-width:100%;border:1px solid #a9c5bf;border-radius:8px;background:white}textarea{width:100%;min-height:100px;padding:12px;border:1px solid #a9c5bf;border-radius:8px}progress{width:100%;accent-color:#176b60} .choices button{display:block;width:100%;margin:9px 0;text-align:left}#feedback{white-space:pre-wrap;line-height:1.7}#play{width:100%;font-size:19px;padding:20px}#status{min-height:24px} [hidden]{display:none!important}footer{font-size:12px;color:#536764;line-height:1.6}</style></head><body><main><h1>TOEIC Listening Trainer</h1><div class="muted">PART 2 · Question–Response | 30 original questions</div><section id="setup"><h2>学習モード</h2><div class="flex"><button data-mode="practice" class="chosen">練習</button><button data-mode="test">本番</button><button data-mode="dictation">Dictation</button></div><p id="desc"></p><label>問題数 <select id="count"><option>10</option><option>20</option><option>30</option></select></label> <label>音声 <select id="accent"><option value="en-US">米国英語</option><option value="en-GB">英国英語</option><option value="en-AU">豪州英語</option><option value="en-CA">カナダ英語</option></select></label><p id="saved"></p><div class="flex"><button class="primary" id="start">スタート</button><button id="review">苦手問題を復習</button></div></section><section id="quiz" hidden><div class="flex"><strong id="number"></strong><span id="points"></span></div><progress id="progress"></progress><p id="prompt"></p><button class="primary" id="play">▶ Listen</button><p id="status" role="status"></p><div id="speedbox"><label>再生速度 <select id="speed"><option value="0.75">0.75×</option><option value="0.9">0.9×</option><option value="1" selected>1.0×</option><option value="1.15">1.15×</option></select></label></div><div id="choices" class="choices"></div><textarea id="written" placeholder="Type the question you hear..." autocomplete="off" autocapitalize="off" spellcheck="false" hidden></textarea><div class="flex"><button id="check" class="primary" disabled>Check answer</button><button id="next" hidden>Next →</button></div><div id="feedback" aria-live="polite"></div><p><button id="quit">終了してメニューへ</button></p></section><section id="result" hidden><h2>Results</h2><div id="summary"></div><div id="details"></div><button id="home" class="primary">メニューへ</button></section><footer>非公式のTOEIC®形式練習教材。音声は端末の読み上げ機能を利用します。音声の種類・発音・利用可否は端末に依存します。学習履歴はこのブラウザ内に保存されます（送信されません）。</footer></main><script>
const data=[["When will the new branch open?", ["On the first of May.", "At the downtown branch.", "Yes, it is open."], 0, "新しい支店はいつ開店しますか。", "When は時期を尋ねる。branch の反復に惑わされない。"], ["Who is in charge of the training session?", ["In the conference room.", "Ms. Chen is.", "For about an hour."], 1, "研修を担当しているのは誰ですか。", "in charge of = ～を担当して。Who に人名で答える。"], ["Where should I leave these documents?", ["I left early yesterday.", "They are important.", "On my desk, please."], 2, "この書類はどこに置けばよいですか。", "should I のつながりと、場所を示す応答に注意。"], ["How often do you update the website?", ["Every other week.", "It is on our website.", "About three pages."], 0, "どのくらいの頻度でウェブサイトを更新しますか。", "How often は頻度。every other week は隔週。"], ["Why was the meeting postponed?", ["Until next Monday.", "The manager was unavailable.", "In the main office."], 1, "なぜ会議は延期されたのですか。", "postpone = 延期する。理由を選ぶ。"], ["Would you like me to print a copy for you?", ["The printer is upstairs.", "I read it yesterday.", "That would be great, thanks."], 2, "コピーを印刷しましょうか。", "Would you like me to は申し出。would you の連結に注意。"], ["Have you submitted your expense report yet?", ["Not yet. I will do it this afternoon.", "It was quite expensive.", "At the reception desk."], 0, "経費報告書はもう提出しましたか。", "現在完了の質問。yet の反復だけでなく意味を確認。"], ["Which supplier offers the lowest price?", ["About fifty dollars.", "The one in Osaka.", "We ordered five."], 1, "どの業者が最も安い価格を提示していますか。", "Which supplier に対応する業者を選ぶ。"], ["Could you tell me how to get to the station?", ["The train is crowded.", "I got there at nine.", "Go straight for two blocks."], 2, "駅への行き方を教えていただけますか。", "Could you は依頼。how to get to は行き方。"], ["Is the conference room available this afternoon?", ["It is booked until four.", "I attended the conference.", "Yes, I have the afternoon off."], 0, "今日の午後、会議室は空いていますか。", "booked は予約済み。直接 Yes/No を言わない応答。"], ["How long does it take to process an order?", ["We ordered ten chairs.", "Usually two business days.", "The process is simple."], 1, "注文処理にどのくらい時間がかかりますか。", "How long は所要時間。business days は営業日。"], ["Who should I contact about the broken air conditioner?", ["It is too cold in here.", "I signed the contract.", "Try the maintenance department."], 2, "故障したエアコンについて誰に連絡すればよいですか。", "contact は連絡する。contract との音の違い。"], ["Did you drive to work or take the train?", ["I took the train.", "Yes, I did.", "At eight thirty."], 0, "車で通勤しましたか、それとも電車ですか。", "選択疑問文には選択肢の一方を答える。"], ["Why don’t we move the presentation to Friday?", ["The presentation was excellent.", "Friday works for me.", "I moved here last year."], 1, "発表を金曜日に変更しませんか。", "Why don’t we は提案であり、理由を尋ねていない。"], ["When is the payment due?", ["By credit card.", "The total is on the invoice.", "At the end of the month."], 2, "支払期限はいつですか。", "due は期限が来る。When に時期で答える。"], ["Do you know where the extra cables are kept?", ["Check the cabinet near the door.", "We need three more.", "Yes, the cable is too short."], 0, "予備のケーブルがどこに保管されているか知っていますか。", "間接疑問文 where ... are kept の語順。"], ["How many people have registered for the workshop?", ["It starts at ten.", "Around twenty so far.", "Registration closes tomorrow."], 1, "研修会には何人が登録しましたか。", "How many は人数。so far は今のところ。"], ["Would you mind closing the window?", ["The window display looks nice.", "It opens at nine.", "Not at all."], 2, "窓を閉めていただけませんか。", "Would you mind ～? に Not at all は快諾。"], ["Has the package arrived, or is it still in transit?", ["It is still on the way.", "I packed it carefully.", "Yes, the station is nearby."], 0, "荷物は到着しましたか、それともまだ輸送中ですか。", "in transit / on the way は輸送中。"], ["Who approved the advertising budget?", ["It was over budget.", "You should ask the finance team.", "We advertised online."], 1, "広告予算を承認したのは誰ですか。", "質問への間接的な応答も正解になり得る。"], ["Could we get a discount on a large order?", ["The order arrived yesterday.", "There are two large boxes.", "Let me check with my supervisor."], 2, "大量注文の場合、割引を受けられますか。", "discount = 割引。確認を申し出る自然な応答。"], ["Where did you find that sales figure?", ["In last month’s report.", "Sales increased by ten percent.", "I found it difficult."], 0, "その売上高の数字はどこで見つけましたか。", "figure は数値。where did you の連結に注意。"], ["Aren’t you attending the seminar tomorrow?", ["The seminar room is large.", "I have another appointment.", "Tomorrow is Wednesday."], 1, "明日のセミナーには参加しないのですか。", "否定疑問文に理由で応答している。"], ["How was your business trip to Singapore?", ["For three days.", "I booked a flight.", "Very productive, actually."], 2, "シンガポールへの出張はいかがでしたか。", "How was ～? は感想を尋ねる。productive = 実りの多い。"], ["Can you cover my shift on Saturday?", ["I’m afraid I already have plans.", "The cover is blue.", "It starts on Monday."], 0, "土曜日のシフトを代わってもらえますか。", "cover a shift = シフトを代わる。I’m afraid は断りの前置き。"], ["What time does the last shuttle leave?", ["From the hotel entrance.", "At quarter past six.", "It takes fifteen minutes."], 1, "最終シャトルは何時に出発しますか。", "quarter past six = 6時15分。時刻と所要時間を区別。"], ["Should we hire another assistant?", ["She started last week.", "The office is on the second floor.", "Let’s see how busy we get next month."], 2, "もう一人アシスタントを雇うべきでしょうか。", "Should we は相談。判断を先送りする応答。"], ["The photocopier is out of paper, isn’t it?", ["I’ve just refilled it.", "I copied three pages yesterday.", "The newspaper is on the table."], 0, "コピー機の用紙が切れていますよね。", "付加疑問文。refill は補充する。"], ["How much notice do I need to give before taking leave?", ["I noticed the sign.", "At least two weeks.", "I left the office early."], 1, "休暇を取る前にどれくらい前もって知らせる必要がありますか。", "notice は事前通知、take leave は休暇を取る。"], ["Wouldn’t it be cheaper to rent the equipment?", ["The equipment is in the warehouse.", "I paid the rent yesterday.", "Probably, if we only need it for a day."], 2, "機材は借りたほうが安いのではないですか。", "Wouldn’t it be ～? は提案・確認。条件付きの同意に注意。"]];const $=id=>document.getElementById(id);let mode='practice',ids=[],pos=0,score=0,chosen=-1,played=false,playing=false,locked=false,answers=[],generation=0;let weak=[];try{weak=JSON.parse(localStorage.getItem('toeic-listening-weak-v1')||'[]').filter(x=>Number.isInteger(x)&&x>=0&&x<data.length)}catch(e){}let storageOK=true;
function save(id,ok){weak=weak.filter(x=>x!==id);if(!ok)weak.push(id);try{localStorage.setItem('toeic-listening-weak-v1',JSON.stringify(weak))}catch(e){storageOK=false}}
function menu(){stop();$('setup').hidden=false;$('quiz').hidden=true;$('result').hidden=true;$('saved').textContent='苦手問題：'+weak.length+'問'+(storageOK?'':'（端末保存不可）');$('review').disabled=!weak.length;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('chosen',b.dataset.mode===mode));$('desc').textContent={practice:'何度でも再生できます。解答後にスクリプトと解説を表示。',test:'音声は原則1回のみ。解説は最後にまとめて表示。',dictation:'質問文を聞き取り、英文を入力。大文字・句読点は採点対象外。'}[mode]}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(review){ids=shuffle(review?[...weak]:data.map((_,i)=>i));if(!review)ids=ids.slice(0,+$('count').value);if(!ids.length)return;pos=score=0;answers=[];$('setup').hidden=true;$('result').hidden=true;$('quiz').hidden=false;render()}
function stop(){generation++;if('speechSynthesis'in window)speechSynthesis.cancel();playing=false}
function render(){stop();chosen=-1;played=locked=false;$('number').textContent=`Question ${pos+1} / ${ids.length}`;$('points').textContent=mode==='test'?'':`Score: ${score}`;$('progress').max=ids.length;$('progress').value=pos;$('prompt').textContent=mode==='dictation'?'Listen and type the question.':'Listen and choose the best response.';$('status').textContent='';$('play').disabled=false;$('play').textContent='▶ Listen';$('speedbox').hidden=mode==='test';$('choices').hidden=mode==='dictation';$('written').hidden=mode!=='dictation';$('written').value='';$('written').disabled=false;$('check').hidden=false;$('check').disabled=true;$('next').hidden=true;$('feedback').textContent='';$('choices').replaceChildren();['A','B','C'].forEach((x,i)=>{let b=document.createElement('button');b.textContent=x;b.onclick=()=>{if(locked||playing||!played)return;chosen=i;[...$('choices').children].forEach((c,j)=>c.classList.toggle('chosen',i===j));updateCheck()};$('choices').append(b)})}
function updateCheck(){$('check').disabled=locked||playing||!played||(mode==='dictation'?!$('written').value.trim():chosen<0)}
function listen(){if(playing||(mode==='test'&&played)||locked)return;if(!('speechSynthesis'in window)){$('status').textContent='このブラウザは読み上げに対応していません。';return}let d=data[ids[pos]],lang=$('accent').value,rate=mode==='test'?1:+$('speed').value,voices=speechSynthesis.getVoices().filter(v=>v.lang.toLowerCase().startsWith('en')),matching=voices.filter(v=>v.lang.toLowerCase()===lang.toLowerCase()),pool=matching.length?matching:voices;let parts=mode==='dictation'?[d[0]]:[d[0],...d[1].map((s,i)=>['A. ','B. ','C. '][i]+s)];playing=true;$('play').disabled=true;$('status').textContent='Playing…';updateCheck();let token=++generation;function fail(){if(token!==generation)return;stop();played=false;$('play').disabled=false;$('status').textContent='音声を再生できませんでした。端末の音声設定を確認して再試行してください。';updateCheck()}function speak(i){if(token!==generation)return;if(i===parts.length){playing=false;played=true;$('play').disabled=mode==='test';$('play').textContent=mode==='test'?'✓ Played':'▶ Listen again';$('status').textContent='';updateCheck();return}let u=new SpeechSynthesisUtterance(parts[i]);u.lang=lang;u.rate=rate;if(pool.length)u.voice=pool[i===0?0:Math.min(1,pool.length-1)];u.onend=()=>setTimeout(()=>speak(i+1),i===0?650:450);u.onerror=fail;speechSynthesis.speak(u)}speak(0)}
function norm(s){return s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function explanation(d){return d[0]+'\n'+d[3]+'\n\n'+d[1].map((s,i)=>['A','B','C'][i]+'. '+s+(i===d[2]?' ✓':'')).join('\n')+'\n\nポイント：'+d[4]}
function check(){if($('check').disabled)return;locked=true;let id=ids[pos],d=data[id],response=mode==='dictation'?$('written').value:chosen,ok=mode==='dictation'?norm(response)===norm(d[0]):chosen===d[2];if(ok)score++;save(id,ok);answers.push({id,ok,response});$('check').hidden=true;$('next').hidden=false;$('next').textContent=pos===ids.length-1?'Results →':'Next →';$('written').disabled=true;$('play').disabled=true;if(mode!=='test'){$('feedback').textContent=(ok?'✓ Correct!':'✗ Not quite.')+'\n\n'+explanation(d);$('points').textContent='Score: '+score;if(mode!=='dictation')[...$('choices').children].forEach((b,i)=>{b.textContent=['A','B','C'][i]+'. '+d[1][i];b.classList.toggle('good',i===d[2]);b.classList.toggle('bad',i===chosen&&!ok)})}else $('feedback').textContent='Answer recorded.'}
function finish(){stop();$('quiz').hidden=true;$('result').hidden=false;$('summary').textContent=`${score} / ${ids.length} correct (${Math.round(score/ids.length*100)}%)`;$('details').replaceChildren();answers.forEach((a,i)=>{let el=document.createElement('details'),s=document.createElement('summary'),p=document.createElement('p');s.textContent=`${i+1}. ${a.ok?'✓':'✗'} ${data[a.id][0]}`;p.style.whiteSpace='pre-wrap';p.textContent='Your answer: '+(mode==='dictation'?a.response:['A','B','C'][a.response])+'\n\n'+explanation(data[a.id]);el.append(s,p);$('details').append(el)})}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;menu()});$('start').onclick=()=>start(false);$('review').onclick=()=>start(true);$('play').onclick=listen;$('written').oninput=updateCheck;$('check').onclick=check;$('next').onclick=()=>{pos++;pos===ids.length?finish():render()};$('quit').onclick=menu;$('home').onclick=menu;menu();if('speechSynthesis'in window)speechSynthesis.getVoices();</script></body></html>
